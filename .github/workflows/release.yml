# Publishes a GitHub Release with the installable zip for each version tag.
# Push a tag v<version> matching manifest.json, e.g. `git tag v0.8.0 && git push origin v0.8.0`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          zip -r "rocksoftware-dna-vaihde-connector-$VERSION.zip" manifest.json options.html options.js src
          unzip -l "rocksoftware-dna-vaihde-connector-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "rocksoftware-dna-vaihde-connector-$VERSION.zip" \
            --title "DNA Vaihde Connector $VERSION" --generate-notes --verify-tag
